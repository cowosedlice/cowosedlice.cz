name: Link Checker

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 7:00 UTC
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-24.04 # ruby/setup-ruby has no Ruby 3.3.6 build for ubuntu-26.04 (ubuntu-latest)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # The footer links to kovosedlice.cz and covosedlice.cz, which no longer
          # resolve: left in on purpose until they are sorted out.
          args: '--no-progress --root-dir _site/ _site/'
          fail: true

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK is not set; no notification."; exit 0; fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"Broken links detected on cowosedlice.cz! Check the report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
